<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMORA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    .header {
      padding: 20px 30px;
      border-bottom: 1px solid #334155;
      background: #111827;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 5px;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      padding: 25px;
      max-width: 1300px;
      margin: auto;
    }

    .chat-box,
    .memory-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 15px;
    }

    .chat-box {
      min-height: 600px;
      display: flex;
      flex-direction: column;
    }

    .chat-header,
    .memory-header {
      padding: 18px;
      border-bottom: 1px solid #334155;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .bot {
      background: #334155;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #334155;
    }

    .input-area input {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      outline: none;
    }

    .input-area button {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .input-area button:hover {
      background: #1d4ed8;
    }

    .input-area button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .memory-content {
      padding: 20px;
    }

    .memory-item {
      padding: 12px;
      margin-bottom: 12px;
      background: #0f172a;
      border-radius: 10px;
    }

    .memory-label {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .memory-value {
      font-size: 14px;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #064e3b;
      color: #a7f3d0;
      font-size: 13px;
    }

    .memory-list {
      margin-top: 15px;
    }

    .memory-result {
      padding: 12px;
      margin-bottom: 10px;
      background: #0f172a;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .memory-title {
      color: #60a5fa;
      font-size: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .thinking {
      opacity: 0.7;
      font-style: italic;
    }

    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">MEMORA AI</div>

    <div class="subtitle">
      Persistent-Memory Customer Support Agent
    </div>
  </header>

  <main class="container">

    <section class="chat-box">

      <div class="chat-header">
        Customer Support
      </div>

      <div class="messages" id="messages">

        <div class="message bot">
          Hello! I'm MEMORA. How can I help you today?
        </div>

      </div>

      <div class="input-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Type your message..."
          onkeydown="handleKey(event)"
        >

        <button id="sendButton" onclick="sendMessage()">
          Send
        </button>

      </div>

    </section>

    <aside class="memory-box">

      <div class="memory-header">
        🧠 Hindsight Memory
      </div>

      <div class="memory-content">

        <div class="memory-item">
          <div class="memory-label">MEMORY SYSTEM</div>
          <div class="memory-value">Hindsight</div>
        </div>

        <div class="memory-item">
          <div class="memory-label">MEMORY BANK</div>
          <div class="memory-value">memora-support</div>
        </div>

        <div class="status" id="memoryStatus">
          ✓ Hindsight memory connected
        </div>

        <div class="memory-list" id="memoryList">
          <div class="memory-result">
            Previous relevant memories will appear here.
          </div>
        </div>

      </div>

    </aside>

  </main>

  <script>

    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");
    const memoryList = document.getElementById("memoryList");
    const memoryStatus = document.getElementById("memoryStatus");

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;

      return message;
    }

    function handleKey(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }

    async function sendMessage() {

      const text = input.value.trim();

      if (!text) {
        return;
      }

      // Show customer message
      addMessage(text, "user");

      input.value = "";

      sendButton.disabled = true;
      sendButton.textContent = "Thinking...";

      // Temporary thinking message
      const thinkingMessage = addMessage(
        "MEMORA is checking previous customer memories...",
        "bot"
      );

      thinkingMessage.classList.add("thinking");

      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })

        });

        const data = await response.json();

        // Remove thinking message
        thinkingMessage.remove();

        if (!response.ok) {

          throw new Error(
            data.error || "Something went wrong"
          );

        }

        // Show real MEMORA response
        addMessage(
          data.reply,
          "bot"
        );

        // Show recalled Hindsight memories
        displayMemories(data.memories);

        memoryStatus.textContent =
          "✓ Memory recalled and conversation saved";

      } catch (error) {

        thinkingMessage.remove();

        addMessage(
          "Sorry, I couldn't connect to my memory system right now.",
          "bot"
        );

        memoryStatus.textContent =
          "⚠ Memory connection error";

        console.error(error);

      } finally {

        sendButton.disabled = false;
        sendButton.textContent = "Send";

        input.focus();

      }

    }

    function displayMemories(memories) {

      memoryList.innerHTML = "";

      if (!memories || memories.length === 0) {

        memoryList.innerHTML = `
          <div class="memory-result">
            No previous relevant memories found.
          </div>
        `;

        return;
      }

      memories.forEach((memory, index) => {

        const item = document.createElement("div");

        item.className = "memory-result";

        item.innerHTML = `
          <div class="memory-title">
            RECALL ${index + 1}
          </div>
          <div>${escapeHtml(memory.text || "Memory found")}</div>
        `;

        memoryList.appendChild(item);

      });

    }

    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
